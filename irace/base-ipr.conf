###############################################################################
# base-ipr.conf: configuracao-base do BRKGA-MP-IPR usada pelo irace.
#
# O target-runner copia este arquivo e SUBSTITUI os parametros calibrados
# (marcados abaixo com [irace]) pelos valores da configuracao candidata. Os
# demais ficam fixos durante toda a calibracao. base-ipr.conf e base-mp.conf
# sao identicos, exceto por ipr_interval.
#
# Decodificador: permutacao, com busca local de reducao.
###############################################################################

population_size 300                  # [irace]
elite_percentage 0.15                # [irace]
mutants_percentage 0.10              # [irace]
num_elite_parents 2                  # [irace]
total_parents 3                      # [irace]
bias_type LOGINVERSE                 # [irace]
num_independent_populations 3        # [irace]

# --- IPR para representacao por permutacao ---------------------------------
pr_number_pairs 0
# KENDALLTAU conta pares discordantes (escala ate' n(n-1)/2). Valor fixo,
# nao calibrado.
pr_minimum_distance 10
pr_type PERMUTATION
pr_selection BESTSOLUTION
pr_distance_function_type KENDALLTAU
alpha_block_size 1.0
pr_percentage 1.0

# --- migracao e perturbacao ------------------------------------------------
# Com uma unica populacao, a API ignora a troca de elite (verificado no codigo).
num_exchange_individuals 2
shaking_type SWAP
shaking_intensity_lower_bound 0.10
shaking_intensity_upper_bound 0.30

# --- controle --------------------------------------------------------------
maximum_running_time 120             # sobrescrito pelo target-runner
exchange_interval 50
ipr_interval 50                      # [irace]
shake_interval 0
reset_interval 0
stall_offset 0
