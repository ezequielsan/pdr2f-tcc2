###############################################################################
# final_perm.conf: BRKGA-MP, configuracao DEFINITIVA da bateria final.
#
# 3a calibracao com irace 4.5.1 (07-08/11/2026): custo = peso, elitistLimit 0,
# 8000 execucoes de 120 s com parada no alvo, sobre as 86 instancias de treino
# (30%, que NAO entram na bateria). Dados em irace/historico/
# 2026-11-07_treino30pct_limite0_custo_peso/.
#
# Escolha: configuracao 1146, a de menor rank medio na validacao das
# finalistas nas 86 instancias de treino x 2 sementes (regra fixada antes;
# irace/valida_finalistas.sh e irace/analisa_validacao.py). As finalistas do
# braco sao estatisticamente equivalentes (Friedman p = 0,999).
#
# Decodificador: permutacao com busca local de reducao.
###############################################################################

population_size 1998
elite_percentage 0.4534
mutants_percentage 0.1558
num_elite_parents 1
total_parents 9
bias_type EXPONENTIAL
num_independent_populations 1

# --- IPR para representacao por permutacao ---------------------------------
pr_number_pairs 0
# KENDALLTAU conta pares discordantes (escala ate' n(n-1)/2). Valor fixo,
# nao calibrado.
pr_minimum_distance 10
pr_type PERMUTATION
pr_selection BESTSOLUTION
pr_distance_function_type KENDALLTAU
alpha_block_size 1.0
pr_percentage 1.0

# --- migracao e perturbacao ------------------------------------------------
# Com uma unica populacao, a API ignora a troca de elite (verificado no codigo).
num_exchange_individuals 2
shaking_type SWAP
shaking_intensity_lower_bound 0.10
shaking_intensity_upper_bound 0.30

# --- controle --------------------------------------------------------------
maximum_running_time 600             # sobrescrito pelo main_complete (--maxtime)
exchange_interval 50
ipr_interval 0                       # fixo: BRKGA-MP, sem IPR
shake_interval 0
reset_interval 0
stall_offset 0
