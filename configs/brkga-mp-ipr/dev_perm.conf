###############################################################################
# dev_perm.conf: BRKGA-MP-IPR com decodificador por permutacao
#
# !!! VALORES NAO CALIBRADOS !!!
#
# Este arquivo existe para DESENVOLVIMENTO e teste de fumaca: ele permite
# rodar o algoritmo de ponta a ponta, nada mais. Os valores abaixo nao vem de
# calibracao nenhuma e NAO devem ser usados em nenhum resultado reportado.
#
# Os valores definitivos virao do irace, calibrado separadamente para cada
# decodificador, conforme claude/protocolo_experimental_fechado.md. Os
# parametros que entram no irace sao: population_size, elite_percentage,
# mutants_percentage, num_elite_parents, total_parents, bias_type,
# num_independent_populations e ipr_interval.
#
# Decodificador: permutacao (+ busca local de reducao)
# Algoritmo: BRKGA-MP-IPR
###############################################################################

################################
# Parametros do BRKGA
################################

population_size 300
elite_percentage 0.15
mutants_percentage 0.10

# Multi-parent: 2 pais elite entre 3 no total.
num_elite_parents 2
total_parents 3

bias_type LOGINVERSE

# Tres populacoes nos DOIS arquivos, de proposito: assim a unica diferenca
# entre o BRKGA-MP e o BRKGA-MP-IPR e' o ipr_interval. Alem disso, no TCC 1 o
# IPR com uma unica populacao reportava "populacao homogenea demais" e zero
# melhorias, porque os cromossomos elite decodificavam todos para a mesma
# rotulacao.
num_independent_populations 3

################################
# Religacao de caminhos (IPR)
################################

# 0 = a API testa pares ate' encontrar um com distancia suficiente.
pr_number_pairs 0

# ATENCAO: com KENDALLTAU a distancia conta PARES DISCORDANTES, cuja escala
# vai a n(n-1)/2. Um valor absoluto pequeno e', portanto, um filtro fraco.
# Valor provisorio, a calibrar.
pr_minimum_distance 10

# PERMUTATION: correto para representacao por permutacao -- troca posicoes.
pr_type PERMUTATION

pr_selection BESTSOLUTION

# KENDALLTAU: fornecida pela API, mede discordancia de ordem.
pr_distance_function_type KENDALLTAU

# Tamanho do bloco = ceil(alpha_block_size * sqrt(population_size)).
alpha_block_size 1.0

# 1.0 = percorre o caminho inteiro entre as duas solucoes.
pr_percentage 1.0

################################
# Migracao e perturbacao
################################

num_exchange_individuals 2

# SWAP: troca chaves de posicao, correto para permutacao.
shaking_type SWAP
shaking_intensity_lower_bound 0.10
shaking_intensity_upper_bound 0.30

################################
# Parametros de controle
#
# Todos os intervalos contam GERACOES SEM MELHORA na melhor solucao, e nao
# geracoes totais. A ordem dentro de uma iteracao e': IPR, troca de elite,
# shake e reset.
################################

# Sobrescrito pela linha de comando do main.
maximum_running_time 60

exchange_interval 50
# Chama o IPR a cada 50 geracoes sem melhora.
ipr_interval 50
shake_interval 0
reset_interval 0

# 0 = nao para por estagnacao.
stall_offset 0
